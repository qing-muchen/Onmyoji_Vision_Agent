# Onmyoji Vision Agent 基础配置
#
# 约定：
#   1. 所有运行期参数集中在此文件，源码中不得硬编码业务配置。
#   2. 相对路径（如 logging.dir）一律相对于项目根目录解析。
#   3. 可通过环境变量覆盖任意字段，格式为 OVA_<段>__<字段>，
#      例如 OVA_LOGGING__LEVEL=DEBUG、OVA_CAPTURE__FPS=30。

app:
  name: "Onmyoji Vision Agent"
  version: "0.1.0"
  env: "dev" # dev | test | prod

capture:
  # 屏幕采集参数，Phase 1 由 Vision Engine 消费
  backend: "auto" # auto | dxcam | mss
  fps: 10
  monitor_index: 1
  # 采集区域 [left, top, width, height]；null 表示整个显示器
  region: null
  # 超过该毫秒数的帧视为过期帧
  max_frame_age_ms: 100
  # 帧缓冲容量：保存最近多少帧（越大越稳，但占用内存约为 N x 单帧大小）
  buffer_size: 10
  # 画面稳定性判断：只判断"画面是否停止变化"，不解读画面内容
  stability:
    enabled: true
    # 参与判断的最少帧数（至少 2 帧才能比较）
    minimum_frames: 3
    # 相邻帧的平均相似度达到该值即视为稳定（0-1）
    similarity_threshold: 0.98

window:
  # 目标游戏窗口定位参数，Phase 1 由 Window Manager 消费
  match_mode: "contains" # exact | contains | regex
  title: "阴阳师"
  title_keywords:
    - "阴阳师"
    - "Onmyoji"
  # 仅截取窗口客户区
  client_only: true
  # 前台控制总开关：采集前自动把目标窗口置为前台
  # （屏幕区域采集的前提；false 时只校验前台、不抢占用户当前窗口）
  auto_focus: true
  # 窗口绑定成功时是否立即置为前台（需 auto_focus 同时为 true）
  activate_on_start: false

calibration:
  # 视觉模型/模板使用的参考分辨率；运行时按窗口客户区尺寸动态映射坐标
  reference_resolution: [1920, 1080]

detector:
  # 模板匹配检测器（Phase 2.1）
  template:
    # 仅支持归一化方法，保证置信度可映射到 0-1
    method: "TM_CCOEFF_NORMED" # TM_CCOEFF_NORMED | TM_CCORR_NORMED | TM_SQDIFF_NORMED
    # 置信度阈值：低于该值的结果不输出
    threshold: 0.85
    # 窗口尺寸不固定，需要多尺度搜索覆盖模板与实际画面的比例差异
    multi_scale: true
    scales:
      - 0.8
      - 0.9
      - 1.0
      - 1.1
      - 1.2
  # OCR 辅助检测（Phase 2.1.1）：用固定文字作为 UI 元素的语义锚点
  ocr:
    # 文字 -> 元素映射；外观随皮肤/活动剧烈变化但文字固定的元素走这条路
    targets:
      - text: "探索"
        element_name: "explore"
        category: "buttons"
  # 结果融合（Phase 2.1.1）：模板（视觉定位）+ OCR（语义）-> 单一结果
  fusion:
    enabled: true
    # 模板是视觉定位来源，权重更高
    template_weight: 0.6
    # OCR 是语义来源，权重略低
    ocr_weight: 0.4
    # 元素相同且 IoU 严格大于该值才视为同一个目标（合并区域取并集）
    iou_threshold: 0.3
    # 只有 OCR 命中时的置信度折价（缺少视觉定位，不丢弃但降权）
    ocr_only_factor: 0.9

scene:
  # 场景识别（Phase 2.2）：整图判断"当前在哪里"，不涉及坐标
  matcher:
    # 置信度阈值：低于该值的场景不输出
    threshold: 0.85
    # 比较前把当前帧与场景模板统一缩放到该尺寸（降低窗口尺寸差异的影响）
    resize_width: 640
    resize_height: 360

ocr:
  # OCR 识别（Phase 2.3）：读取屏幕文字；不解读文字含义、不做决策
  provider:
    # 识别引擎：tesseract（后续可扩展 paddle / easyocr / windows）
    name: "tesseract"
    # Tesseract 语言包，多语言用 + 连接
    language: "chi_sim+eng"
  preprocess:
    # 预处理顺序：灰度化 -> 放大 -> 二值化
    # 放大倍数（小字放大后识别率更高）
    scale: 2
    # 二值化阈值（0-255）
    threshold: 128

state:
  # 游戏状态识别（Phase 3.0）：Frame -> StateResult（yard | transition | unknown）
  # 只做视觉识别，不做状态转移、不触发任何交互
  transition:
    # 转场/加载插画内容多变，禁止整图比较，只使用底部固定条带
    enabled: true
    # 底部裁剪比例（条带高度 / 帧高度）；实测条带 58px / 完整帧 961px ≈ 0.06
    crop_height_ratio: 0.06
    # 条带统一缩放尺寸（吸收不同窗口尺寸的差异，约保持条带原始宽高比）
    resize_width: 640
    resize_height: 22
    # 正样本相似度下限
    threshold: 0.85
    # 负样本间隔：要求"正样本最高分 - 负样本最高分"不低于该值
    # （实测留一法：正样本 gap ≥ 0.049、负样本 gap ≤ 0.014，0.03 为区间中值）
    negative_margin: 0.03
    # 宽高比（宽/高）不低于该值时视为"输入本身已经是条带"，不再裁剪
    # （条带样本约 29:1，完整帧约 1.8:1）
    strip_aspect_ratio: 8.0
  yard:
    # 庭院**视觉组件**（复用场景识别能力；threshold 会覆盖 scene.matcher.threshold）。
    # Phase 4.6.5：本开关只决定"是否装配该独立组件"——它**不参与状态判定**。
    # 庭院状态（yard）的唯一权威来源是证据路径：
    #   evidence.detectors.bottom_menu_yard + evidence.aggregator.rules 的 yard 规则
    #   （依据稳定的底部功能栏结构，不随庭院皮肤 / 布局变化漂移）。
    # 该组件保留供离线分析 / 后续其它视觉任务使用。
    enabled: true
    threshold: 0.85

evidence:
  # 视觉证据层（Phase 4.1-4.4）：Frame -> [EvidenceResult] -> StateCandidate -> stable state
  # 只提取可解释的视觉证据，**不直接输出状态**；状态映射全部由 aggregator 的规则完成。
  #
  # detectors 的公共默认值（各条目可单独覆盖）：
  #   threshold: 0.85        证据置信度下限（低于该值的匹配不算命中）
  #   method: TM_CCOEFF_NORMED、multi_scale: true、scales: [0.8,0.9,1.0,1.1,1.2]
  #   max_templates: 8       最多加载多少个模板（均匀抽样，控制匹配耗时）
  #   min_templates: 3       模板数量门槛；低于该值视为数据不足
  #   shortfall_factor: 0.7  数据不足时的置信度折价（不允许伪造高准确率）
  #   ocr_weight: 0.4        模板与 OCR 双源命中时的 OCR 权重
  #   ocr_only_factor: 0.9   仅 OCR 命中（缺少视觉定位）时的置信度折价
  enabled: true
  # 证据可靠度（Phase 4.3）：证据名 -> **长期**可靠程度，范围 (0, 1]。
  # 与 confidence（当帧匹配强度）是两个独立维度；聚合器按
  #   score = sum(confidence * reliability) / sum(reliability)
  # 做加权平均，因此低可靠度的旁证不会显著拉低强证据的结论。
  # 判定依据：界面形态是否独特（误报率）、是否容易被动画/遮挡影响。
  reliability:
    # 转场底部条带（深棕底纹 + 官网文字）形态固定、误报率低；Phase 4.6.4 起作为证据
    transition_banner: 0.95
    # 结算 / 奖励界面形态独特，误报率低
    victory_icon: 0.95
    reward_panel: 0.95
    # 底部功能栏与章节栏是稳定的结构性 UI
    bottom_menu_yard: 0.9
    bottom_menu_exploration: 0.9
    chapter_panel: 0.9
    # 自动按钮与技能区跨皮肤形态稳定
    battle_auto_button: 0.8
    battle_skill_area: 0.8
    # 行动条 / 式神头像易被技能动画遮挡，且两者区域重叠、独立价值有限
    battle_action_bar: 0.5
    battle_shikigami_icons: 0.5
  # 未在上表登记的证据使用该兜底可靠度（1.0 = 未标定就按等权处理）
  default_reliability: 1.0
  # 证据分组（Phase 4.4）：同一 group 内的 detector 观察**同一块视觉区域**。
  # 同一区域上的多次命中在空间上高度相关，聚合时只作一条代表参与计分，
  # 规则也可以按 group 数（min_groups）而不是证据条数计数。
  # 未出现在任何 group 里的证据自成一组（以自身证据名作为组名）。
  groups:
    battle_left_ui:
      members: ["battle_auto_button"]
    battle_bottom_ui:
      members: ["battle_skill_area"]
    # 行动条与式神头像都落在战斗界面右侧同一块 UI 上，因此同组
    battle_right_ui:
      members: ["battle_action_bar", "battle_shikigami_icons"]
  # 候选状态的时间窗口（Phase 4.4）。
  # .. deprecated:: Phase 4.7
  #    时间滤波的唯一归属是 runtime 层（runtime.stabilization + StateStabilizer）；
  #    本段仅供已标记 deprecated 的 evidence.history.EvidenceHistory（无生产调用方）使用，
  #    保留是为兼容既有配置与离线分析，Phase 5 可随该模块一起删除。
  history:
    # 保留最近多少个候选状态
    window_size: 5
    # 窗口内同一状态出现多少次才认为稳定
    min_state_count: 3
  detectors:
    # 注意：bottom_menu 刻意拆成 yard / exploration 两个 detector——
    # 两类底部功能栏的图标组成与上下文完全不同，合并会丢掉区分度。
    bottom_menu_yard:
      enabled: true
      # ROI 为相对整帧的比例 [x0, y0, x1, y1]：底部功能栏
      roi: [0.00, 0.80, 1.00, 1.00]
      templates: "dataset/features/bottom_menu/yard/positive"
      threshold: 0.85
      max_templates: 8
    bottom_menu_exploration:
      enabled: true
      roi: [0.00, 0.80, 1.00, 1.00]
      templates: "dataset/features/bottom_menu/exploration/positive"
      threshold: 0.85
      max_templates: 8
    chapter_panel:
      enabled: true
      # 探索界面右侧章节栏（主线/玩法 + 第二十六~二十八章）
      roi: [0.80, 0.15, 1.00, 0.70]
      templates: "dataset/features/chapter_panel/positive"
      threshold: 0.85
      max_templates: 6
      # OCR 语义锚点：章节文字跨皮肤稳定
      text_targets: ["第二十六章", "第二十七章", "第二十八章", "主线", "玩法"]
    battle_auto_button:
      enabled: true
      # 左下角自动/手动按钮
      roi: [0.00, 0.74, 0.12, 1.00]
      templates: "dataset/features/battle/auto_button/positive"
      threshold: 0.85
      text_targets: ["自动", "手动"]
    # Phase 4.2：battle 证据链扩展。战斗 UI 的有效证据分散在三处，
    # 各自独立成 detector，由 aggregator 综合判断（不做单一 ROI 合并）。
    battle_skill_area:
      enabled: true
      # 底部技能按钮区（妖术/普攻）
      roi: [0.60, 0.74, 0.92, 1.00]
      templates: "dataset/features/battle/skill_area/positive"
      threshold: 0.85
    battle_action_bar:
      enabled: true
      # 右侧行动顺序条
      roi: [0.90, 0.04, 1.00, 0.72]
      templates: "dataset/features/battle/action_bar/positive"
      threshold: 0.85
    battle_shikigami_icons:
      enabled: true
      # 行动条上的式神头像（与 action_bar 区域相邻，语义不同：遮挡容错）
      roi: [0.925, 0.09, 1.00, 0.60]
      templates: "dataset/features/battle/shikigami_icons/positive"
      threshold: 0.85
    victory_icon:
      enabled: true
      # 结算界面中心：胜利图标与「胜利」字样
      roi: [0.25, 0.05, 0.85, 0.40]
      templates: "dataset/features/victory_icon/positive"
      threshold: 0.85
      text_targets: ["胜利"]
      # 当前正样本仅 1 张：显式保留数据不足的折价标记，不允许伪造高准确率
      min_templates: 3
      shortfall_factor: 0.7
    reward_panel:
      enabled: true
      # 奖励展示中心区：奖励卡片 + 中央奖励
      roi: [0.15, 0.15, 0.62, 0.90]
      templates: "dataset/features/reward_panel/positive"
      threshold: 0.85
      min_templates: 3
      shortfall_factor: 0.7
    # Phase 4.6.4：转场条带改为**证据**。本 detector 是"包装型"：
    # 不使用 ROI 模板，判定复用 state.transition 的 TransitionClassifier
    # （底部条带 + 正负样本双侧判别），由编排层通过
    # create_detectors(..., transition_classifier=...) 注入；
    # 因此这里只有开关——阈值仍然只有一份，留在 state.transition。
    transition_banner:
      enabled: true
  aggregator:
    # 证据 -> 候选状态的映射规则（声明式：新增状态只需加规则，无需改代码）
    # requires: 必须全部命中；any_of + min_groups: 候选证据需覆盖至少 min_groups 个不同 group
    #
    # 两个**不同**的阈值（Phase 4.6.6 明确区分）：
    #   min_confidence   —— **证据准入阈值**：单条证据是否足够参与状态判断；
    #   state_confidence —— **状态可信度**：规则命中后输出状态的可信度下限（可选）。
    #     规则完整满足、且参与证据的平均可靠度 >= min_reliability 时，状态可信度取
    #     max(证据得分, min)；否则等于证据得分（详见 evidence/aggregator.py 模块文档）。
    enabled: true
    fallback_state: "unknown"
    rules:
      # 顺序影响同分时的优先级；已满足的规则按得分降序择优（同分保持声明顺序）。
      # 转场条带是专属强特征，放在首位以保持 Phase 3.0 的"transition 优先"语义。
      - state: "transition"
        any_of: ["transition_banner"]
        min_confidence: 0.6
      # 已满足的规则按得分降序择优
      - state: "battle_result"
        requires: ["victory_icon"]
        min_confidence: 0.6
        # 单样本证据：victory_icon 只有 1 张正样本 → 置信度被 shortfall_factor 折价到 0.70；
        # 但证据类型唯一、规则明确、该类证据可靠度 0.95（形态独特、误报低）
        # → 状态可信度不应低于 0.85，否则会被稳定化门槛（0.85）永久挡掉
        state_confidence:
          mode: rule_based
          min: 0.85
          min_reliability: 0.9
      - state: "battle_reward"
        requires: ["reward_panel"]
        min_confidence: 0.6
        state_confidence:
          mode: rule_based
          min: 0.85
          min_reliability: 0.9
      # 战斗（Phase 4.4）：按**视觉区域**计数，需覆盖至少两个不同 group。
      # 行动条与式神头像同属 battle_right_ui，一起命中只算一个区域，
      # 因此"只有右侧 UI 亮起"不会被误判为战斗。
      - state: "battle"
        any_of: ["battle_auto_button", "battle_skill_area", "battle_action_bar", "battle_shikigami_icons"]
        min_groups: 2
        min_confidence: 0.6
      - state: "exploration"
        requires: ["bottom_menu_exploration", "chapter_panel"]
        min_confidence: 0.6
      - state: "yard"
        requires: ["bottom_menu_yard"]
        min_confidence: 0.6

runtime:
  # 运行期编排（Phase 3.1）：把单帧状态识别扩展为持续运行的监控过程
  state_monitor:
    # 采集 + 识别的固定周期（毫秒）；节拍固定，不随单轮耗时漂移
    interval_ms: 500
    # 状态历史文件（相对路径以项目根为基准；logs/ 已被 .gitignore 忽略）
    history_path: "logs/state_history.json"
    # 是否落盘；关闭时只打印、不写文件
    save_history: true
    # 事件历史上限（超出后丢弃最旧事件，防止文件无限增长）
    max_events: 1000
    # 每个周期是否检查目标窗口在前台：只检查、不抢占，失焦则跳过该轮（计入 skipped）
    check_foreground: true
    # 逐轮运行指标（Phase 5.2）：cycle_id / timestamp / state / stable_state / latency，
    # JSON Lines（每轮一行）。**不含截图与任何用户数据**；只作观测，写入失败不影响主循环。
    metrics_path: "logs/runtime_metrics.jsonl"
    # 是否落盘；默认 false（可选观测能力，零副作用）。
    # live_runtime_demo.py 默认开启并写入上面的路径，便于长跑后统计。
    save_metrics: false
  # 状态稳定化（Phase 3.2）：把逐帧识别结果稳定为"稳定状态"
  stabilization:
    # 总开关；关闭时退化为"每帧立即确认"（等价 min_frames=1）
    enabled: true
    # 稳定窗口：连续多少帧相同状态才确认
    min_frames: 3
    # 置信度阈值：已知状态低于该值的帧不计入稳定计数（unknown 豁免，因其置信度恒为 0）
    confidence_threshold: 0.85
  # 失败恢复策略（Phase 5.4）：长时间运行时"暂时采不到"是常态（游戏未启动、窗口最小化、
  # 设备会话失效）。启用后：连续失败按指数退避重试，超过 max_retry 后结束运行并进入 FAILED
  # （不会死循环、不会忙等）。未启用时保持 Phase 5.2/5.3 行为：失败只记 skipped 并继续下一轮。
  recovery:
    # 默认关闭；长跑建议开启（等游戏窗口出现时用 max_retry: 0 表示不放弃）
    enabled: false
    # 连续失败重试上限；0 = 不放弃（仍受 max_backoff_s 限制，不会忙等）
    max_retry: 3
    # 首次退避时长（秒）
    backoff_s: 0.5
    # 退避倍数（指数增长）
    backoff_factor: 2.0
    # 单次退避上限（秒）
    max_backoff_s: 8.0

logging:
  level: "INFO" # DEBUG | INFO | WARNING | ERROR | CRITICAL
  dir: "logs"
  filename: "agent.log"
  console: true
  file: true
  # 单文件上限 5 MiB，最多保留 5 个滚动文件
  max_bytes: 5242880
  backup_count: 5
  format: "%(asctime)s | %(levelname)-8s | %(name)-20s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
